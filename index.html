        body, html {

        /* Cadmium Periodic Table Element Badge */
.brand-logo {
    position: absolute;

    flex-direction: column;
    align-items: center;
    justify-content: center;

    z-index: 10;

.brand-number {
    font-size: 8px;
    line-height: 8px;
    font-weight: 500;
    color: var(--text-secondary);
    letter-spacing: 0.5px;
}

.brand-symbol {
    font-size: 14px;
    line-height: 15px;
    font-weight: 700;
    color: var(--text-primary);

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* The main curved glass card */
        .glass-card {
            --fill-level: 0%; 
            width: 320px;
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 40px; 
            padding: 30px 24px; 
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-primary);
            box-sizing: border-box;
            position: relative;
            overflow: hidden; 
            z-index: 1;
        }

        /* Ambient Fill Animation */
        .glass-card::before {
            content: '';
            position: absolute;
            bottom: 0;
            left: -10%; 
            width: 120%;
            height: var(--fill-level); 
            z-index: -1; 
            background: linear-gradient(-45deg, #4158D0, #C850C0, #2c3e50, #FFCC70);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            filter: blur(20px);
            transition: height 0.5s linear; 
        }

        /* 3-Slide Carousel Viewport */
        .carousel-viewport {
            width: 240px;
            height: 240px;
            border-radius: 20px;
            margin-bottom: 12px;
            box-shadow: inset 0 0 15px rgba(255,255,255,0.05), 0 10px 20px rgba(0,0,0,0.3);
            overflow-x: auto;
            overflow-y: hidden;
            display: flex;
            scroll-snap-type: x mandatory;
            scrollbar-width: none;
            -webkit-overflow-scrolling: touch;
            cursor: grab;
        }
        .carousel-viewport::-webkit-scrollbar { display: none; }
        .carousel-viewport:active { cursor: grabbing; }

        .carousel-slide {
            flex: 0 0 240px;
            width: 240px;
            height: 240px;
            scroll-snap-align: center;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            overflow: hidden;
        }

        .carousel-slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%);
            pointer-events: none;
        }

        .carousel-slide svg {
            width: 80px;
            height: 80px;
            fill: var(--text-secondary);
        }

        /* Slide 1: Lyrics Drawer */
        .lyrics-container {
            width: 90%;
            height: 90%;
            overflow-y: auto;
            scrollbar-width: none;
            text-align: center;
            font-size: 13px;
            line-height: 1.8;
            color: var(--text-secondary);
            padding: 90px 4px; /* Padding allows top and bottom lines to center nicely */
            box-sizing: border-box;
            scroll-behavior: smooth;
        }
        .lyrics-container::-webkit-scrollbar { display: none; }

        .lyric-line {
            transition: all 0.3s ease;
            opacity: 0.4;
            transform: scale(0.95);
            margin: 8px 0;
        }

        .lyric-line.active {
            color: #ffffff;
            opacity: 1;
            font-weight: 600;
            font-size: 14px;
            transform: scale(1.05);
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        /* Slide 3: Playlist Selector Drawer */
        .playlist-drawer {
            display: flex;
            flex-direction: column;
            gap: 8px;
            width: 90%;
            height: 90%;
            justify-content: center;
        }

        .playlist-drawer-title {
            font-size: 11px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin: 0 0 4px 4px;
        }

        .playlist-chip {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--glass-border);
            padding: 10px 14px;
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 13px;
            font-weight: 500;
            text-align: left;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .playlist-chip:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .playlist-chip.active {
            background: rgba(255, 204, 112, 0.2);
            border-color: #FFCC70;
            color: #FFCC70;
        }

        /* Carousel Navigation Dots */
        .carousel-dots {
            display: flex;
            gap: 6px;
            margin-bottom: 16px;
        }

        .dot {
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transition: all 0.2s ease;
        }

        .dot.active {
            background: #ffffff;
            width: 14px;
            border-radius: 3px;
        }

        /* Track Info */
        .track-info {
            width: 100%;
            text-align: center;
            margin-bottom: 20px;
        }

        .track-title {
            font-size: 19px;
            font-weight: 600;
            margin: 0 0 6px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-artist {
            font-size: 12px;
            color: var(--text-secondary);
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        /* Thicker Progress Bar */
        .progress-container {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 20px;
        }

        .progress-bar-bg {
            flex: 1;
            height: 8px;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
            margin: 0 12px;
            position: relative;
            cursor: pointer;
        }

        .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: var(--text-primary);
            border-radius: 4px;
            position: relative;
            transition: width 0.1s linear;
        }

        .progress-bar-fill::after {
            content: '';
            position: absolute;
            right: -6px;
            top: -3px;
            width: 14px;
            height: 14px;
            background: var(--text-primary);
            border-radius: 50%;
            box-shadow: 0 0 8px rgba(0,0,0,0.6);

            align-items: center;

        .icon-btn {

            transition: transform 0.2s;

            width: 40px !important;
            height: 40px !important;
        }

            position: absolute;
            left: -9999px;
            visibility: hidden;
        }

      title: title || 'Cadmium Track',
      artist: artist || 'YouTube Audio',
      album: 'Cadmium Player',
      artwork: [
        { src: artworkUrl || 'icon-512.png', sizes: '512x512', type: 'image/png' }
      ]
    });

    navigator.mediaSession.setActionHandler('play', () => togglePlayPause());
    navigator.mediaSession.setActionHandler('pause', () => togglePlayPause());
    navigator.mediaSession.setActionHandler('previoustrack', () => {
      if (player && player.previousVideo) player.previousVideo();
    });
    navigator.mediaSession.setActionHandler('nexttrack', () => {
      if (player && player.nextVideo) player.nextVideo();
    });
  }
}

// --- Synced Lyrics Engine ---

function parseLRC(lrcText) {
    const lines = lrcText.split('\n');
    const result = [];
    const timeReg = /\[(\d{2}):(\d{2})(?:\.(\d{2,3}))?\]/;

    for (const line of lines) {
        const match = timeReg.exec(line);
        if (match) {
            const mins = parseInt(match[1], 10);
            const secs = parseInt(match[2], 10);
            const ms = match[3] ? parseInt(match[3].padEnd(3, '0').substring(0, 3), 10) / 1000 : 0;
            const time = mins * 60 + secs + ms;
            const text = line.replace(timeReg, '').trim();
            if (text) {
                result.push({ time, text });
            }
        }
    }
    return result.sort((a, b) => a.time - b.time);
}

async function fetchLyrics(rawTitle) {
    const container = document.getElementById('lyrics-container');
    if (!container) return;

    container.innerHTML = '<div id="lyrics-content" style="opacity: 0.6;">Searching lyrics...</div>';
    syncedLyrics = [];
    activeLyricIndex = -1;

    const cleanedTitle = rawTitle
        .replace(/(\[.*?\]|\(.*?\))/g, '')
        .replace(/(official video|official audio|music video|8k|4k|hd|lyrics|audio)/gi, '')
        .trim();

    try {
        const res = await fetch(`https://lrclib.net/api/search?q=${encodeURIComponent(cleanedTitle)}`);
        const data = await res.json();
        
        if (data && data.length > 0) {
            const hit = data[0];
            if (hit.syncedLyrics) {
                syncedLyrics = parseLRC(hit.syncedLyrics);
                container.innerHTML = syncedLyrics
                    .map((l, i) => `<div class="lyric-line" id="lyric-${i}">${l.text}</div>`)
                    .join('');
            } else if (hit.plainLyrics) {
                container.innerHTML = `<div style="white-space: pre-wrap; opacity: 0.8;">${hit.plainLyrics}</div>`;
            } else {
                container.innerHTML = '<div style="opacity: 0.6;">No lyrics found for this track.</div>';
            }
        } else {
            container.innerHTML = '<div style="opacity: 0.6;">No lyrics found for this track.</div>';
        }
    } catch (err) {
        container.innerHTML = '<div style="opacity: 0.6;">Could not load lyrics.</div>';
    }
}

function syncLyricsScroll(currentTime) {
    if (!syncedLyrics.length) return;

    const adjustedTime = currentTime + LYRICS_OFFSET;

    let currentIndex = -1;
    for (let i = 0; i < syncedLyrics.length; i++) {
        if (adjustedTime >= syncedLyrics[i].time) {
            currentIndex = i;
        } else {
            break;
        }
    }

    if (currentIndex !== -1 && currentIndex !== activeLyricIndex) {
        const prevEl = document.getElementById(`lyric-${activeLyricIndex}`);
        if (prevEl) prevEl.classList.remove('active');

        activeLyricIndex = currentIndex;
        const activeEl = document.getElementById(`lyric-${activeLyricIndex}`);
        
        if (activeEl) {
            activeEl.classList.add('active');
            
            const container = document.getElementById('lyrics-container');
            if (container) {
                const targetScroll = (activeEl.offsetTop - container.offsetTop) - (container.clientHeight / 2) + (activeEl.clientHeight / 2);
                container.scrollTo({
                    top: Math.max(0, targetScroll),
                    behavior: 'smooth'
                });
            }
        }
    }
}

// --- Playback Controls ---

function togglePlayPause() {
    if (!player || !player.getPlayerState) return;
    if (player.getPlayerState() === YT.PlayerState.PLAYING) {
        player.pauseVideo();
    } else {
        player.playVideo();
    }
}

function toggleShuffle() {
    if (!player || !player.setShuffle) return;
    isShuffleOn = !isShuffleOn;
    player.setShuffle(isShuffleOn);
    const btn = document.getElementById('btn-shuffle');
    if (btn) btn.classList.toggle('active', isShuffleOn);
}

function toggleLoop() {
    if (!player || !player.setLoop) return;
    loopMode = (loopMode + 1) % 3;
    const btn = document.getElementById('btn-loop');
    const iconLoop = document.getElementById('icon-loop');
    const iconLoopOne = document.getElementById('icon-loop-one');
    
    if (loopMode === 0) {
        player.setLoop(false);
        if (btn) btn.classList.remove('active');
        if (iconLoop) iconLoop.style.display = 'block';
        if (iconLoopOne) iconLoopOne.style.display = 'none';
    } else if (loopMode === 1) {
        player.setLoop(true);
        if (btn) btn.classList.add('active');
        if (iconLoop) iconLoop.style.display = 'block';
        if (iconLoopOne) iconLoopOne.style.display = 'none';
    } else if (loopMode === 2) {
        player.setLoop(true);
        if (btn) btn.classList.add('active');
        if (iconLoop) iconLoop.style.display = 'none';
        if (iconLoopOne) iconLoopOne.style.display = 'block';
    }
}

function formatTime(seconds) {
    const mins = Math.floor(seconds / 60);
    const secs = Math.floor(seconds % 60);
    return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
}

function updateProgressBar() {
    if (player && player.getCurrentTime && player.getDuration) {
        const current = player.getCurrentTime();
        const duration = player.getDuration();
        
        syncLyricsScroll(current);

        // Single-track loop preemptive seek override
        if (loopMode === 2 && duration > 0 && (duration - current) < 0.4) {
            player.seekTo(0, true);
            return;
        }
        
        const curTimeEl = document.getElementById('current-time');
        const totTimeEl = document.getElementById('total-time');
        if (curTimeEl) curTimeEl.innerText = formatTime(current);
        if (totTimeEl) totTimeEl.innerText = formatTime(duration);
        
        const percentage = duration > 0 ? (current / duration) * 100 : 0;
        
        const progFill = document.getElementById('progress-fill');
        if (progFill) progFill.style.width = `${percentage}%`;
        
        const mainCard = document.getElementById('main-card');
        if (mainCard) mainCard.style.setProperty('--fill-level', `${percentage}%`);
    }
}

const progressBg = document.getElementById('progress-bg');
if (progressBg) {
    progressBg.addEventListener('click', function(e) {
        if (player && player.getDuration) {
            const rect = this.getBoundingClientRect();
            const clickX = e.clientX - rect.left;
            const percentage = clickX / rect.width;
            const seekTime = percentage * player.getDuration();
            
            player.seekTo(seekTime, true);
            const mainCard = document.getElementById('main-card');
            if (mainCard) mainCard.style.setProperty('--fill-level', `${percentage * 100}%`);
            syncLyricsScroll(seekTime);
        }
    });
}
    </script>
