<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e24" />
      <stop offset="100%" stop-color="#0d0d11" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFCC70" />
      <stop offset="50%" stop-color="#C850C0" />
      <stop offset="100%" stop-color="#4158D0" />
    </linearGradient>
  </defs>

  <!-- Outer Glass / Rounded Tile -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bgGrad)" stroke="url(#glowGrad)" stroke-width="12" />
  
  <!-- Subtle Inner Inset Border -->
  <rect x="48" y="48" width="416" height="416" rx="80" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="4" />

  <!-- Atomic Number 48 -->
  <text x="256" y="150" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="600" fill="rgba(255, 255, 255, 0.7)" text-anchor="middle" letter-spacing="4">48</text>

  <!-- Cadmium Symbol (Cd) -->
  <text x="256" y="310" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="160" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="-2">Cd</text>

  <!-- Element Name Subtitle -->
  <text x="256" y="390" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="600" fill="#FFCC70" text-anchor="middle" letter-spacing="6">CADMIUM</text>
</svg>
